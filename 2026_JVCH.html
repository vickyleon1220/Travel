    // ==========================================

    function App() {
      const [lang, setLang] = useState('zh');
      const [activeTab, setActiveTab] = useState('itinerary');
      const [selectedCategory, setSelectedCategory] = useState('hokkaido');
      const [selectedDay, setSelectedDay] = useState(1);

      // 本地儲存 Persistence (備份讀取)
      const [itinerary, setItinerary] = useState(() => {
        const saved = localStorage.getItem('2026_itinerary_v2');
        return saved ? JSON.parse(saved) : defaultItinerary;
      });

      const [packingList, setPackingList] = useState(() => {
        const saved = localStorage.getItem('2026_packingList_v2');
        return saved ? JSON.parse(saved) : defaultPackingList;
      });

      const [todos, setTodos] = useState(() => {
        const saved = localStorage.getItem('2026_todos_v2');
        return saved ? JSON.parse(saved) : defaultTodos;
      });

      const [flights, setFlights] = useState(() => {
        const saved = localStorage.getItem('2026_flights_v2');
        return saved ? JSON.parse(saved) : defaultFlights;
      });

      const [hotels, setHotels] = useState(() => {
        const saved = localStorage.getItem('2026_hotels_v2');
        return saved ? JSON.parse(saved) : defaultHotels;
      });

      const [hsr, setHsr] = useState(() => {
        const saved = localStorage.getItem('2026_hsr_v2');
        return saved ? JSON.parse(saved) : defaultHsr;
      });

      // 自動儲存至 localStorage
      useEffect(() => {
        localStorage.setItem('2026_itinerary_v2', JSON.stringify(itinerary));
      }, [itinerary]);

      useEffect(() => {
        localStorage.setItem('2026_packingList_v2', JSON.stringify(packingList));
      }, [packingList]);

      useEffect(() => {
        localStorage.setItem('2026_todos_v2', JSON.stringify(todos));
      }, [todos]);

      useEffect(() => {
        localStorage.setItem('2026_flights_v2', JSON.stringify(flights));
      }, [flights]);

      useEffect(() => {
        localStorage.setItem('2026_hotels_v2', JSON.stringify(hotels));
      }, [hotels]);

      useEffect(() => {
        localStorage.setItem('2026_hsr_v2', JSON.stringify(hsr));
      }, [hsr]);

      // 行程編輯狀態
      const [editingEventId, setEditingEventId] = useState(null);
      const [editForm, setEditForm] = useState({ time: '', activity: '', notes: '' });
      const [isAddingEvent, setIsAddingEvent] = useState(false);
      const [newForm, setNewForm] = useState({ time: '', activity: '', notes: '' });

      // 行李與待辦編輯狀態
      const [newPackItemText, setNewPackItemText] = useState({ James: '', Vicky: '', Chenn: '', Honn: '' });
      const [newTodoText, setNewTodoText] = useState('');

      // 切換區域時，自動將選取天數導向該區域第一天
      const handleCategoryChange = (cat) => {
        setSelectedCategory(cat);
        const found = itinerary.find((item) => item.category === cat);
        if (found) {
          setSelectedDay(found.day);
        }
      };

      const currentCategoryDays = itinerary.filter((item) => item.category === selectedCategory);
      const currentDayData = itinerary.find((item) => item.day === selectedDay) || currentCategoryDays[0];

      const t = dict[lang];

      // 將帶有雙語的行李名稱進行簡單分流呈現
      const getTranslatedItem = (text) => {
        if (lang === 'zh') return text;
        const matches = text.match(/[A-Za-z\s()/'-]+/g);
        return matches ? matches.join(' ').trim() : text;
      };

      // ==========================================
      // 行程表增刪改查邏輯
      // ==========================================

      const startEditEvent = (evt) => {
        setEditingEventId(evt.id);
        setEditForm({ time: evt.time, activity: evt.activity, notes: evt.notes });
      };

      const cancelEditEvent = () => {
        setEditingEventId(null);
      };

      const saveEditedEvent = (dayId, evtId) => {
        setItinerary(prev =>
          prev.map(d => {
            if (d.day === dayId) {
              return {
                ...d,
                events: d.events.map(e => e.id === evtId ? { ...e, ...editForm } : e)
              };
            }
            return d;
          })
        );
        setEditingEventId(null);
      };

      const deleteEvent = (dayId, evtId) => {
        if (window.confirm(lang === 'zh' ? '確定要刪除此行程項目嗎？' : 'Are you sure you want to delete this event?')) {
          setItinerary(prev =>
            prev.map(d => {
              if (d.day === dayId) {
                return {
                  ...d,
                  events: d.events.filter(e => e.id !== evtId)
                };
              }
              return d;
            })
          );
        }
      };

      const startAddEvent = () => {
        setIsAddingEvent(true);
        setNewForm({ time: '09:00', activity: '', notes: '' });
      };

      const saveNewEvent = (dayId) => {
        if (!newForm.activity.trim()) return;
        const newId = `e-custom-${Date.now()}`;
        const addedEvent = { id: newId, ...newForm };

        setItinerary(prev =>
          prev.map(d => {
            if (d.day === dayId) {
              const updatedEvents = [...d.events, addedEvent].sort((a, b) => {
                return a.time.localeCompare(b.time);
              });
              return { ...d, events: updatedEvents };
            }
            return d;
          })
        );
        setIsAddingEvent(false);
      };

      // ==========================================
      // 行李清單與待辦清單邏輯
      // ==========================================

      const togglePackItem = (person, itemId) => {
        setPackingList(prev => ({
          ...prev,
          [person]: prev[person].map(item => item.id === itemId ? { ...item, checked: !item.checked } : item)
        }));
      };

      const addPackItem = (person) => {
        const text = newPackItemText[person].trim();
        if (!text) return;
        const newItem = {
          id: `pack-${person}-${Date.now()}`,
          text: text,
          checked: false
        };
        setPackingList(prev => ({
          ...prev,
          [person]: [...prev[person], newItem]
        }));
        setNewPackItemText(prev => ({ ...prev, [person]: '' }));
      };

      const deletePackItem = (person, itemId) => {
        setPackingList(prev => ({
          ...prev,
          [person]: prev[person].filter(item => item.id !== itemId)
        }));
      };

      const toggleTodoItem = (todoId) => {
        setTodos(prev => prev.map(t => t.id === todoId ? { ...t, checked: !t.checked } : t));
      };

      const addTodoItem = () => {
        if (!newTodoText.trim()) return;
        const newTodo = {
          id: `todo-${Date.now()}`,
          text: newTodoText.trim(),
          checked: false
        };
        setTodos(prev => [...prev, newTodo]);
        setNewTodoText('');
      };

      const deleteTodoItem = (todoId) => {
        setTodos(prev => prev.filter(t => t.id !== todoId));
      };

      // ==========================================
      // 高相容性剪貼簿複製 (解決 iframe 限制)
      // ==========================================
      const handleCopyText = (text) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        // 隱藏 textarea 避開視覺干擾
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        textArea.style.top = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        
        try {
          const successful = document.execCommand('copy');
          if (successful) {
            alert(lang === 'zh' ? '地址已成功複製！' : 'Address successfully copied!');
          } else {
            throw new Error('Fallback failed');
          }
        } catch (err) {
          // 嘗試現代 Clipboard API 作為備份
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
              .then(() => alert(lang === 'zh' ? '地址已成功複製！' : 'Address successfully copied!'))
              .catch(() => alert('無法複製地址，請手動複製。'));
          } else {
            alert('無法複製地址，請手動複製。');
          }
        }
        document.body.removeChild(textArea);
      };

      // ==========================================
      // 匯出與匯入 JSON 檔案備份
      // ==========================================

      const handleExportPlan = () => {
        const fullPlan = {
          itinerary,
          packingList,
          todos,
          flights,
          hotels,
          hsr
        };
        const blob = new Blob([JSON.stringify(fullPlan, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `2026_Japan_Taiwan_Trip_Plan_${lang}.json`;
        link.click();
        alert(t.backupSuccess);
      };

      const handleImportPlan = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (imported.itinerary) setItinerary(imported.itinerary);
            if (imported.packingList) setPackingList(imported.packingList);
            if (imported.todos) setTodos(imported.todos);
            if (imported.flights) setFlights(imported.flights);
            if (imported.hotels) setHotels(imported.hotels);
            if (imported.hsr) setHsr(imported.hsr);
            alert(t.importSuccess);
          } catch (err) {
            alert('無效的 JSON 行程檔案！Invalid JSON format!');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-16">
          
          {/* ================= HEADER ================= */}
          <header className="bg-gradient-to-r from-pink-100 via-emerald-50 to-pink-50 border-b border-emerald-100 sticky top-0 z-50 shadow-sm backdrop-blur-md bg-opacity-95">
            <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-gradient-to-tr from-pink-400 to-emerald-400 p-2.5 rounded-full text-white shadow-md">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                  </svg>
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-black text-slate-800 tracking-tight">
                    {t.siteTitle}
                  </h1>
                  <p className="text-xs sm:text-sm text-slate-500 font-medium">{t.subtitle}</p>
                </div>
              </div>
              
              <div className="flex flex-wrap items-center gap-2">
                {/* 備份按鈕組 */}
                <button 
                  onClick={handleExportPlan}
                  className="px-3 py-1.5 text-xs font-bold text-emerald-800 bg-emerald-100 hover:bg-emerald-200 border border-emerald-300 rounded-lg shadow-sm transition-all duration-200"
                >
                  {t.exportBtn}
                </button>
                <label className="px-3 py-1.5 text-xs font-bold text-pink-800 bg-pink-100 hover:bg-pink-200 border border-pink-300 rounded-lg shadow-sm transition-all duration-200 cursor-pointer">
                  {t.importBtn}
                  <input type="file" accept=".json" onChange={handleImportPlan} className="hidden" />
                </label>

                {/* 語系切換 */}
                <button 
                  onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')}
                  className="px-4 py-1.5 text-xs font-bold rounded-lg shadow-md bg-white border border-slate-200 hover:border-pink-300 hover:text-pink-600 transition-all duration-200 flex items-center gap-2"
                >
                  🌐 {t.langBtn}
                </button>
              </div>
            </div>
          </header>

          {/* ================= MAIN TABS ================= */}
          <nav className="max-w-7xl mx-auto px-4 mt-6">
            <div className="flex flex-wrap items-center bg-white p-1 rounded-2xl border border-slate-200 shadow-sm gap-1 overflow-x-auto scrollbar-none">
              <button 
                onClick={() => setActiveTab('itinerary')}
                className={`flex-1 min-w-[120px] text-center py-3 text-sm font-bold rounded-xl transition-all duration-200 flex items-center justify-center gap-2 ${
                  activeTab === 'itinerary' 
                    ? 'bg-pink-100 text-pink-700 shadow-sm' 
                    : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                }`}
              >
                🗓️ {t.tabs.itinerary}
              </button>
              <button 
                onClick={() => setActiveTab('flights')}
                className={`flex-1 min-w-[120px] text-center py-3 text-sm font-bold rounded-xl transition-all duration-200 flex items-center justify-center gap-2 ${
                  activeTab === 'flights' 
                    ? 'bg-pink-100 text-pink-700 shadow-sm' 
                    : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                }`}
              >
                ✈️ {t.tabs.flights}
              </button>

            )}

            {/* ================= TAB: PACKING LIST ================= */}
            {activeTab === 'packing' && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                  <div className="border-b border-slate-100 pb-4">
                    <h2 className="text-xl font-extrabold text-slate-800">🎒 {t.tabs.packing} (個人行李準備清單)</h2>
                    <p className="text-xs text-slate-500 mt-1">
                      {lang === 'zh' 
                        ? '此列表為每人表列不歸類，勾選隨時同步。您可以自由增加與刪除行李單項。' 
                        : 'Flat listed items per person with no grouping. Toggle/delete items easily.'}
                    </p>
                  </div>

                  {/* 4 個人的清單卡片 */}
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mt-6">
                    {Object.keys(packingList).map((person) => (
                      <div key={person} className="bg-slate-50/50 p-4 rounded-2xl border border-slate-200/60 flex flex-col justify-between">
                        <div>
                          <div className="bg-gradient-to-r from-pink-400 to-emerald-400 text-white rounded-xl p-3 text-center font-black text-sm shadow-sm mb-4">
                            🧑‍🚀 {person === 'Chenn' ? 'Chenn (QQ)' : person === 'Honn' ? 'Honn (JJ)' : person === 'James' ? '爸比 James' : '媽咪 Vicky'}
                          </div>

                          <div className="space-y-2.5 max-h-96 overflow-y-auto pr-1">
                            {packingList[person].map((item) => (
                              <div 
                                key={item.id} 
                                className="flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-slate-100 hover:border-pink-200 transition-all duration-150"
                              >
                                <label className="flex items-center gap-2.5 cursor-pointer flex-1">
                                  <input 
                                    type="checkbox" 
                                    checked={item.checked}
                                    onChange={() => togglePackItem(person, item.id)}
                                    className="w-4 h-4 rounded text-emerald-500 focus:ring-emerald-400 focus:ring-opacity-20 border-slate-300 cursor-pointer"
                                  />
                                  <span className={`text-xs font-semibold ${item.checked ? 'line-through text-slate-300 font-medium' : 'text-slate-700'}`}>
                                    {getTranslatedItem(item.text)}
                                  </span>
                                </label>

                                <button
                                  onClick={() => deletePackItem(person, item.id)}
                                  className="text-slate-300 hover:text-red-500 text-xs px-1 hover:bg-red-50 rounded"
                                >
                                  ✕
                                </button>
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* 新增個人行李輸入框 */}
                        <div className="mt-4 pt-3 border-t border-slate-200">
                          <div className="flex gap-1.5">
                            <input 
                              type="text" 
                              value={newPackItemText[person]}
                              onChange={(e) => setNewPackItemText({ ...newPackItemText, [person]: e.target.value })}
                              className="flex-1 px-2.5 py-1.5 text-xs border border-slate-300 rounded-xl focus:outline-none focus:ring-1 focus:ring-pink-400 bg-white"
                              placeholder={t.addPackItem}
                            />
                            <button
                              onClick={() => addPackItem(person)}
                              className="px-2.5 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-black rounded-xl transition-all"
                            >
                              ＋
                            </button>
                          </div>
                        </div>

                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ================= TAB: TO-DO ================= */}
            {activeTab === 'todo' && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm max-w-3xl mx-auto">
                  <h2 className="text-xl font-extrabold text-slate-800 border-b border-slate-100 pb-4">📝 {t.tabs.todo} (行前準備與待辦)</h2>
                  
                  {/* 新增待辦項目 */}
                  <div className="flex gap-2 mt-6">
                    <input 
                      type="text"
                      value={newTodoText}
                      onChange={(e) => setNewTodoText(e.target.value)}
                      className="flex-1 px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent bg-slate-50 text-sm"
                      placeholder={t.addTodoItem}
                    />
                    <button
                      onClick={addTodoItem}
                      className="px-5 py-2.5 bg-pink-500 hover:bg-pink-600 text-white font-extrabold rounded-xl shadow shadow-pink-100 transition-all"
                    >
                      {lang === 'zh' ? '確認新增' : 'Add Item'}
                    </button>
                  </div>

                  {/* 待辦項目列表 */}
                  <div className="space-y-3 mt-6">
                    {todos.map((todo) => (
                      <div 
                        key={todo.id} 
                        className="flex items-center justify-between bg-slate-50 px-4 py-3 rounded-xl border border-slate-200/40 hover:border-pink-200 transition-all"
                      >
                        <label className="flex items-center gap-3 cursor-pointer flex-1">
                          <input 
                            type="checkbox"
                            checked={todo.checked}
                            onChange={() => toggleTodoItem(todo.id)}
                            className="w-5 h-5 rounded text-pink-500 focus:ring-pink-400 focus:ring-opacity-20 border-slate-300 cursor-pointer"
                          />
                          <span className={`text-sm font-bold ${todo.checked ? 'line-through text-slate-300 font-medium' : 'text-slate-700'}`}>
                            {todo.text}
                          </span>
                        </label>

                        <button 
                          onClick={() => deleteTodoItem(todo.id)}
                          className="text-slate-400 hover:text-red-500 p-1.5 hover:bg-red-50 rounded"
                        >
                          🗑️
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* 頁尾資訊 */}
          <footer className="max-w-7xl mx-auto text-center mt-12 text-slate-400 text-xs">
            <p>© 2026 {t.siteTitle}. All Rights Reserved. Created lovingly for James, Vicky, Chenn, and Honn. 🌸☘️</p>
          </footer>

        </div>
      );
    }

    // 將 App 元件掛載到 DOM 的 root 節點
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
